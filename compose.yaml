services:
  db:
    image: postgres:17
    profiles: ["database"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smoke_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先设置本地数据库密码}
      POSTGRES_DB: ${POSTGRES_DB:-smoke_mock}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smoke_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  smoke_pgdata:

